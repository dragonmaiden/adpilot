services:
  - type: web
    name: adpilot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: adpilot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        value: act_1407071387528879
      - key: META_BUSINESS_ID
        value: 1037680327881084
      - key: IMWEB_CLIENT_ID
        sync: false
      - key: IMWEB_CLIENT_SECRET
        sync: false
      - key: IMWEB_REFRESH_TOKEN
        sync: false
      - key: IMWEB_SITE_CODE
        value: S20260108741f7ad4afc71
      - key: IMWEB_UNIT_CODE
        value: u20260108695f4cab3dea1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: PAYWAY_ENABLED
        value: "true"
      - key: PAYWAY_BASE_URL
        value: https://payway.kr
      - key: PAYWAY_MID
        value: TMN009889,TMN025656
      - key: PAYWAY_DASHBOARD_ID
        sync: false
      - key: PAYWAY_DASHBOARD_PASSWORD
        sync: false
      - key: PAYWAY_SESSION_COOKIE
        sync: false
      - key: PAYWAY_HISTORY_PATH
        value: /pay
      - key: PAYWAY_WATCH_MINUTES
        value: "10"
      - key: PAYWAY_POLL_INTERVAL_SECONDS
        value: "30"
      - key: PAYWAY_MATCH_LEAD_MINUTES
        value: "2"
      - key: PAYWAY_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: SCAN_INTERVAL_MINUTES
        value: "3"
